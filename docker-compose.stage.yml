version: '3.8'

services:
  backend:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/todo
      - static_volume:/todo/static
      - media_volume:/todo/media
    expose:
      - 8000
    depends_on:
      - redis
      - celery
      - celery-beat

  redis:
    image: redis:latest
    ports:
      - 6379:6379
    restart: always

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/todo
    depends_on:
      - redis

  celery-beat:
    build: .
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/todo
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    restart: always
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/todo/static
      - media_volume:/todo/media
    depends_on:
      - backend

volumes:
  static_volume:
  media_volume:
